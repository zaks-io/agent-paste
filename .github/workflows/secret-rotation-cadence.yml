name: Secret Rotation Cadence

on:
  push:
    branches:
      - main
    paths:
      - ops/secret-rotation-cadence.json
      - scripts/check-secret-rotation-cadence.mjs
      - .github/workflows/secret-rotation-cadence.yml
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-rotation-cadence
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check 90-day cadence
        id: cadence
        continue-on-error: true
        run: node scripts/check-secret-rotation-cadence.mjs > "$RUNNER_TEMP/rotation-cadence.json"

      - name: Open overdue rotation issue
        if: ${{ steps.cadence.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Rotate production signing keys"
          existing="$(gh issue list --state open --search "in:title $title" --limit 1000 --json title --jq '.[] | select(.title == "Rotate production signing keys") | .title')"
          if [ -n "$existing" ]; then
            exit 0
          fi
          reason="$(jq -r .reason "$RUNNER_TEMP/rotation-cadence.json")"
          gh issue create --title "$title" --body "$reason

          Follow docs/ops/runbook-rotation.md for content-signing and upload-signing. After production verification, record the canonical completion timestamp in ops/secret-rotation-cadence.json."
